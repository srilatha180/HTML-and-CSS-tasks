<!DOCTYPE html>
<html lang="en-in">
    <head>
      <title>Scroll bar</title>
      <style>
        .scroll{
            background-color: rgb(191, 255, 0);
            width:100%;
            height:50px;
            color: black;
            animation-name: srilatha;
            animation-duration: 20s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            position:relative;
           text-align: center;
            overflow: hidden;
        }
        @keyframes srilatha{
            from{left:1px; background-color: yellow; transform:translateX(-100%);}
            to{left:100%; background-color:yellow; transform:translateX(100%);}
        }
       
      </style>
    </head>
    <body>
        <div class="scroll">
            <p>LTE Technosoft</p>
        </div>

    </body>
</html>
