<!DOCTYPE html>
<html lang="en-in">
    <head>
        <title>Animations</title>
        <style>
            .first{
                width:200px;
                height:150px;
                background-color: aqua;
                animation-name: srilatha;
                animation-duration: 10s;
                animation-direction: alternate;
                position: relative;


            }
             @keyframes srilatha{
            from{left:0px; background-color: rgb(0, 255, 38);}
            to{left:200px; background-color: rgb(255, 0, 0);}
        }

        </style>
       

    </head>
    <body>
        <div class="first">

        </div>

    </body>
</html>
